<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF006E">
  <title>Product Team Bingo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>

  <button id="new-card" class="new-card-btn" type="button" aria-label="Nová karta">Nová karta</button>

  <header class="header">
    <h1 class="title">Product&nbsp;Team<br>Bingo</h1>
  </header>

  <main class="main">
    <div class="controls">
      <div class="size-selector" role="radiogroup" aria-label="Velikost karty">
        <button class="size-btn" data-size="3" type="button" role="radio" aria-checked="false">3×3</button>
        <button class="size-btn active" data-size="5" type="button" role="radio" aria-checked="true">5×5</button>
      </div>
    </div>

    <div id="grid" class="grid grid-5" role="grid" aria-label="Bingo karta"></div>
  </main>

  <div id="celebration" class="celebration hidden" aria-live="polite" aria-hidden="true">
    <div class="celebration-text" aria-label="Bingo!">BINGO!</div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <script src="phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
